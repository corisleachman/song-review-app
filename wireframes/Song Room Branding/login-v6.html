/* ── PAGE ── */
.page {
  position: relative;
  z-index: 1;
  height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto 1fr auto;
}

/* ── NAV ── */
nav {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 28px 40px;
}

.nav-brand {
  font-family: 'Thunder', Impact, sans-serif;
  font-size: 17px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--off-white);
}

/* ── LEFT — AUTH ── */
.left {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 48px 48px;
}

/* Tab switcher */
.tabs {
  display: flex;
  gap: 0;
  margin-bottom: 20px;
  border: 1px solid var(--border);
  width: fit-content;
}

.tab-btn {
  padding: 11px 28px;
  font-family: var(--ui);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: transparent;
  border: none;
  color: rgba(244,240,232,0.38);
  cursor: pointer;
  transition: color 140ms, background 140ms;
  white-space: nowrap;
}

.tab-btn:first-child { border-right: 1px solid var(--border); }

.tab-btn.active {
  background: var(--off-white);
  color: var(--charcoal);
}

.tab-btn:not(.active):hover {
  color: var(--off-white);
  background: rgba(244,240,232,0.06);
}

/* Auth panel */
.auth-panel {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 340px;
}

.hidden { display: none !important; }

/* Google button */
.btn-google {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 20px;
  background: rgba(244,240,232,0.08);
  border: 1px solid var(--border);
  color: var(--off-white);
  font-family: var(--ui);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: background 140ms, border-color 140ms;
  width: 100%;
  backdrop-filter: blur(6px);
}

.btn-google:hover {
  background: rgba(244,240,232,0.14);
  border-color: rgba(244,240,232,0.3);
}

/* Email toggle */
.btn-email-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 11px 20px;
  background: transparent;
  border: 1px solid var(--border-lo);
  color: rgba(244,240,232,0.38);
  font-family: var(--ui);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: color 140ms, border-color 140ms;
  width: 100%;
}

.btn-email-toggle:hover {
  color: rgba(244,240,232,0.7);
  border-color: var(--border);
}

.chevron {
  transition: transform 280ms var(--ease-out);
  flex-shrink: 0;
}

.chevron.open { transform: rotate(180deg); }

/* Email fields */
.email-fields {
  overflow: hidden;
  max-height: 0;
  opacity: 0;
  transition:
    max-height 380ms var(--ease-out),
    opacity 240ms var(--ease-out);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.email-fields.open {
  max-height: 260px;
  opacity: 1;
}

.field-input {
  width: 100%;
  padding: 13px 14px;
  background: rgba(10,10,10,0.65);
  border: 1px solid var(--border);
  color: var(--off-white);
  font-family: var(--ui);
  font-size: 13px;
  outline: none;
  transition: border-color 140ms;
  backdrop-filter: blur(6px);
  -webkit-appearance: none;
}

.field-input::placeholder { color: rgba(244,240,232,0.26); }
.field-input:focus { border-color: var(--off-white); }

.btn-submit {
  width: 100%;
  padding: 14px 20px;
  background: var(--off-white);
  border: none;
  color: var(--charcoal);
  font-family: var(--ui);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity 140ms;
}

.btn-submit:hover { opacity: 0.88; }

.form-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 2px;
}

.forgot a, .terms-link {
  font-size: 11px;
  font-weight: 500;
  color: rgba(244,240,232,0.3);
  text-decoration: none;
  transition: color 140ms;
  letter-spacing: 0.04em;
}

.forgot a:hover, .terms-link:hover { color: var(--off-white); }

/* ── RIGHT — HEADLINE ── */
.right {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  padding: 0 48px 48px 24px;
}

.hero-headline {
  font-family: 'Thunder', Impact, 'Arial Narrow Bold', sans-serif;
  font-size: clamp(110px, 14vw, 190px);
  font-weight: 900;
  line-height: 0.72;
  letter-spacing: 0;
  text-transform: uppercase;
  color: var(--off-white);
}

/* ── FOOTER ── */
footer {
  grid-column: 1 / -1;
  padding: 0 40px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.footer-note {
  font-size: 11px;
  color: rgba(244,240,232,0.22);
  letter-spacing: 0.06em;
}

/* ── LOAD ANIM ── */
@keyframes fade-up {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

.left  { animation: fade-up 0.55s 0.05s var(--ease-out) both; }
.right { animation: fade-up 0.55s 0.0s  var(--ease-out) both; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="bg"></div>

<div class="page">

  <!-- NAV -->
  <nav>
    <div class="nav-brand">The Song Room</div>
  </nav>

  <!-- LEFT: AUTH -->
  <div class="left">

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login', this)">Log in</button>
      <button class="tab-btn" onclick="switchTab('signup', this)">Sign up</button>
    </div>

    <!-- LOGIN -->
    <div class="auth-panel" id="view-login">
      <button class="btn-google">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Log in with Google
      </button>

      <button class="btn-email-toggle" onclick="toggleEmail('login')">
        <span>Continue with email</span>
        <svg class="chevron" id="chev-login" width="10" height="6" viewBox="0 0 10 6" fill="none">
          <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
        </svg>
      </button>

      <div class="email-fields" id="ef-login">
        <input class="field-input" type="email" placeholder="Email address">
        <input class="field-input" type="password" placeholder="Password">
        <button class="btn-submit">Log in</button>
        <div class="form-footer">
          <div class="forgot"><a href="#">Forgot password?</a></div>
        </div>
      </div>
    </div>

    <!-- SIGNUP -->
    <div class="auth-panel hidden" id="view-signup">
      <button class="btn-google">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign up with Google
      </button>

      <button class="btn-email-toggle" onclick="toggleEmail('signup')">
        <span>Sign up with email</span>
        <svg class="chevron" id="chev-signup" width="10" height="6" viewBox="0 0 10 6" fill="none">
          <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
        </svg>
      </button>

      <div class="email-fields" id="ef-signup">
        <input class="field-input" type="email" placeholder="Email address">
        <input class="field-input" type="password" placeholder="Password (min 8 characters)">
        <button class="btn-submit">Create account</button>
        <div class="form-footer">
          <a class="terms-link" href="#">Terms &amp; Privacy</a>
        </div>
      </div>
    </div>

  </div>

  <!-- RIGHT: HEADLINE -->
  <div class="right">
    <h1 class="hero-headline">
      Create<br>Together
    </h1>
  </div>

  <!-- FOOTER -->
  <footer>
    <span class="footer-note">© The Song Room 2026</span>
    <span class="footer-note">Collaborative music review</span>
  </footer>

</div>

<script>
  function switchTab(name, el) {
    document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('view-login').classList.toggle('hidden', name !== 'login');
    document.getElementById('view-signup').classList.toggle('hidden', name !== 'signup');
    // Close email fields on tab switch
    ['login','signup'].forEach(v => {
      document.getElementById('ef-' + v).classList.remove('open');
      document.getElementById('chev-' + v).classList.remove('open');
    });
  }

  function toggleEmail(view) {
    const fields = document.getElementById('ef-' + view);
    const chev   = document.getElementById('chev-' + view);
    const isOpen = fields.classList.contains('open');
    fields.classList.toggle('open', !isOpen);
    chev.classList.toggle('open', !isOpen);
  }
</script>
</body>
</html>
