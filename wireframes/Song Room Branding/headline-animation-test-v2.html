  position: absolute;
  inset: 0;

    linear-gradient(to right,
      rgba(0,0,0,0.18) 0%,

      rgba(0,0,0,0.92) 100%
    );
}

/* Page */
.page {
  position: relative;
  z-index: 1;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0 60px;
}

/* ── HEADLINE ── */
.headline {
  position: relative;
  line-height: 0.84;
  text-align: left;
}

/* Each word is a block */
.word {
  display: block;
  position: relative;
}

/* 
  The technique:
  - h1 carries the visible gradient-filled text
  - h1::before is the stacked depth shadow (same text, offset layers)
  - h1::after is a ghost copy slightly offset for extra dimension
  - clip-path animates from bottom up to reveal each word
*/

.word-inner {
  font-family: 'ThunderBlack', Impact, 'Arial Narrow Bold', sans-serif;
  font-size: 18vw;
  font-weight: 900;
  line-height: 0.84;
  letter-spacing: 0;
  text-transform: uppercase;
  position: relative;
  display: inline-block;

  /* Gradient fill on the text itself */
  background: linear-gradient(
    to bottom,
    #ffffff  0%,
    #F4EDE4  30%,
    #e8ddd4  65%,
    #D4C4B0  100%
  );
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* Depth shadow layer — stacked text-shadow on ::before */
.word-inner::before {
  content: attr(data-text);
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  z-index: -1;
  /* -webkit-text-fill-color reset so shadow shows */
  -webkit-text-fill-color: transparent;
  background: none;
  /* Stacked shadows create the 3D stepped depth effect */
  text-shadow:
    1px 1px 0 var(--deep),
    2px 2px 0 var(--deep),
    3px 3px 0 var(--deep),
    4px 4px 0 var(--deep),
    5px 5px 0 var(--deep),
    6px 6px 0 var(--deep),
    7px 7px 0 var(--deep),
    8px 8px 0 var(--deep),
    9px 9px 0 var(--deep),
    10px 10px 0 rgba(192,57,43,0.6),
    11px 11px 0 rgba(192,57,43,0.4),
    12px 12px 0 rgba(192,57,43,0.2),
    13px 13px 0 rgba(192,57,43,0.1),
    14px 14px 0 rgba(0,0,0,0.08);
}

/* Offset ghost for extra dimension */
.word-inner::after {
  content: attr(data-text);
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  z-index: -2;
  transform: translate(12px, 8px);
  background: linear-gradient(
    to bottom,
    #F4EDE4  0%,
    #D4C4B0  50%,
    #8C7B6B  100%
  );
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  opacity: 0.25;
}

/* ── DRAW ANIMATION ── */
/* Clip path wipes from bottom up — like ink being drawn upward */
@keyframes draw-up {
  0% {
    clip-path: inset(100% 0 0 0);
    opacity: 0;
  }
  8% {
    opacity: 1;
  }
  100% {
    clip-path: inset(0% 0 0 0);
    opacity: 1;
  }
}

/* The depth shadows also animate — starting with a big red glow, 
   tightening to the stacked steps as the letter arrives */
@keyframes shadow-resolve {
  0% {
    text-shadow:
      0 0 0 transparent,
      1px 1px 0 var(--deep),
      2px 2px 0 var(--deep),
      3px 3px 0 var(--deep),
      4px 4px 0 var(--deep),
      5px 5px 0 var(--deep),
      6px 6px 0 rgba(192,57,43,0.7),
      8px 8px 0 rgba(192,57,43,0.5),
      10px 10px 0 rgba(192,57,43,0.3),
      12px 12px 0 rgba(192,57,43,0.15),
      16px 16px 40px rgba(192,57,43,0.4);
  }
  100% {
    text-shadow:
      1px 1px 0 var(--deep),
      2px 2px 0 var(--deep),
      3px 3px 0 var(--deep),
      4px 4px 0 var(--deep),
      5px 5px 0 var(--deep),
      6px 6px 0 var(--deep),
      7px 7px 0 var(--deep),
      8px 8px 0 var(--deep),
      9px 9px 0 var(--deep),
      10px 10px 0 rgba(192,57,43,0.6),
      11px 11px 0 rgba(192,57,43,0.4),
      12px 12px 0 rgba(192,57,43,0.2),
      13px 13px 0 rgba(192,57,43,0.1),
      14px 14px 0 rgba(0,0,0,0.08);
  }
}

.word-inner.animate {
  animation: draw-up 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.word-inner.animate::before {
  animation: shadow-resolve 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* Replay */
.replay {
  position: fixed;
  bottom: 32px;
  right: 40px;
  padding: 10px 20px;
  background: transparent;
  border: 1px solid rgba(244,237,228,0.18);
  color: rgba(244,237,228,0.35);
  font-family: -apple-system, sans-serif;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  cursor: pointer;
  transition: all 150ms;
  z-index: 10;
}
.replay:hover { border-color: rgba(244,237,228,0.4); color: #F4EDE4; }

.note {
  position: fixed;
  bottom: 32px;
  left: 40px;
  font-family: -apple-system, sans-serif;
  font-size: 11px;
  font-style: italic;
  color: rgba(244,237,228,0.22);
  z-index: 10;
}
</style>
</head>

<div class="bg"></div>

<div class="page">
  <div class="headline">
    <div class="word">
      <span class="word-inner" id="w1" data-text="CREATE">CREATE</span>
    </div>
    <div class="word">
      <span class="word-inner" id="w2" data-text="TOGETHER">TOGETHER</span>
    </div>
  </div>
</div>

<button class="replay" onclick="replay()">↺ Replay</button>
<div class="note">Draw-in animation test</div>

<script>
  function animate() {
    const w1 = document.getElementById('w1');
    const w2 = document.getElementById('w2');

    w1.classList.remove('animate');
    w2.classList.remove('animate');
    void w1.offsetWidth;
    void w2.offsetWidth;

    // Stagger: CREATE first, TOGETHER 300ms later
    setTimeout(() => w1.classList.add('animate'), 200);
    setTimeout(() => w2.classList.add('animate'), 500);
  }

  function replay() {
    animate();
  }

  // Auto-play — wait for fonts
  setTimeout(animate, 700);
</script>
