<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Song Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Thunder';
  src: url('https://raw.githubusercontent.com/corisleachman/song-review-app/main/wireframes/fonts/Thunder-BlackLC.otf') format('opentype');
  font-weight: 900;
  font-style: normal;
}
@font-face {
  font-family: 'ThunderLC';
  src: url('https://raw.githubusercontent.com/corisleachman/song-review-app/main/wireframes/fonts/Thunder-LC.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --off-white: #F4F0E8;
  --charcoal:  #111111;
  --sand:      #D8CBB8;
  --border:    rgba(244,240,232,0.16);
  --border-lo: rgba(244,240,232,0.08);
  --ui:        'DM Sans', -apple-system, sans-serif;
  --ease-out:  cubic-bezier(0.23, 1, 0.32, 1);
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: var(--ui);
  -webkit-font-smoothing: antialiased;
  background: #000;
  color: var(--off-white);
}

/* ── BACKGROUND ── */
.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
}

/* Each slide sits absolutely on top of each other, crossfade via opacity */
.bg-slide {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center top;
  opacity: 0;
  transition: opacity 2s ease-in-out;
}

.bg-slide.active { opacity: 1; }

.bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    linear-gradient(to right,
      rgba(0,0,0,0.18) 0%,
      rgba(0,0,0,0.30) 42%,
      rgba(0,0,0,0.72) 65%,
      rgba(0,0,0,0.88) 100%
    ),
    linear-gradient(to bottom,
      rgba(0,0,0,0.08) 0%,
      rgba(0,0,0,0.38) 100%
    );
}

/* ── PAGE GRID ── */
.page {
  position: relative;
  z-index: 1;
  height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto 1fr auto auto;
}

/* ── NAV ── */
nav {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 28px 44px;
}

.nav-brand {
  font-family: 'Thunder', Impact, sans-serif;
  font-size: 17px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--off-white);
}

/* ── LEFT — AUTH ── */
.left {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 48px 56px;
}

.tabs {
  display: flex;
  border: 1px solid var(--border);
  width: fit-content;
  margin-bottom: 18px;
}

.tab-btn {
  padding: 11px 26px;
  font-family: var(--ui);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: transparent;
  border: none;
  color: rgba(244,240,232,0.36);
  cursor: pointer;
  transition: color 140ms, background 140ms;
  white-space: nowrap;
}

.tab-btn:first-child { border-right: 1px solid var(--border); }

.tab-btn.active {
  background: var(--off-white);
  color: var(--charcoal);
}

.tab-btn:not(.active):hover {
  color: var(--off-white);
  background: rgba(244,240,232,0.06);
}

.auth-panel {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 320px;
}

.hidden { display: none !important; }

.btn-google {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 18px;
  background: rgba(244,240,232,0.08);
  border: 1px solid var(--border);
  color: var(--off-white);
  font-family: var(--ui);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: background 140ms, border-color 140ms;
  width: 100%;
  backdrop-filter: blur(6px);
}

.btn-google:hover {
  background: rgba(244,240,232,0.14);
  border-color: rgba(244,240,232,0.3);
}

.btn-email-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 11px 18px;
  background: transparent;
  border: 1px solid var(--border-lo);
  color: rgba(244,240,232,0.36);
  font-family: var(--ui);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: color 140ms, border-color 140ms;
  width: 100%;
}

.btn-email-toggle:hover {
  color: rgba(244,240,232,0.7);
  border-color: var(--border);
}

.chevron {
  transition: transform 280ms var(--ease-out);
  flex-shrink: 0;
}

.chevron.open { transform: rotate(180deg); }

.email-fields {
  overflow: hidden;
  max-height: 0;
  opacity: 0;
  transition:
    max-height 380ms var(--ease-out),
    opacity 240ms var(--ease-out);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.email-fields.open {
  max-height: 260px;
  opacity: 1;
}

.field-input {
  width: 100%;
  padding: 13px 14px;
  background: rgba(10,10,10,0.65);
  border: 1px solid var(--border);
  color: var(--off-white);
  font-family: var(--ui);
  font-size: 13px;
  outline: none;
  transition: border-color 140ms;
  backdrop-filter: blur(6px);
  -webkit-appearance: none;
}

.field-input::placeholder { color: rgba(244,240,232,0.26); }
.field-input:focus { border-color: var(--off-white); }

.btn-submit {
  width: 100%;
  padding: 14px 18px;
  background: var(--off-white);
  border: none;
  color: var(--charcoal);
  font-family: var(--ui);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: opacity 140ms;
}

.btn-submit:hover { opacity: 0.88; }

.form-footer {
  padding-top: 2px;
}

.form-footer a, .terms-link {
  font-size: 11px;
  font-weight: 500;
  color: rgba(244,240,232,0.28);
  text-decoration: none;
  transition: color 140ms;
}

.form-footer a:hover, .terms-link:hover { color: var(--off-white); }

.field-error {
  font-size: 12px;
  color: #ff6b6b;
  padding: 6px 2px;
  line-height: 1.45;
}

/* ── RIGHT — HEADLINE ── */
.right {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 88px 56px 16px;
}

.headline-svg-wrap { width: 100%; }

.hero-tagline {
  font-family: 'ThunderLC', Impact, sans-serif;
  font-size: 33px;
  font-weight: 400;
  font-style: normal;
  color: #F4F0E8;
  line-height: 1.5;
  letter-spacing: -0.02em;
  max-width: 620px;
  position: relative;
  top: -40px;
  left: 21px;
}

/* ── FOOTER ── */
footer {
  grid-column: 1 / -1;
  padding: 0 44px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.footer-note {
  font-size: 11px;
  color: rgba(244,240,232,0.2);
  letter-spacing: 0.05em;
}

/* ── ANIMATIONS ── */
@keyframes fade-up {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

.left  { animation: fade-up 0.55s 0.06s var(--ease-out) both; }
.right {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 88px 56px 16px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ── EQ VISUALISER ── */
.eq-bar-wrap {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 56px;
  padding: 0;
  overflow: hidden;
  z-index: 10;
}

.eq-bar {
  flex: 1;
  background: rgba(244,240,232,0.18);
  transform-origin: bottom;
  transition: height 80ms cubic-bezier(0.23, 1, 0.32, 1);
  min-width: 2px;
  border-radius: 0;
}

</style>
</head>

        Sign up with Google
      </button>

      <button class="btn-email-toggle" onclick="toggleEmail('signup')">
        <span>Sign up with email</span>
        <svg class="chevron" id="chev-signup" width="10" height="6" viewBox="0 0 10 6" fill="none">
          <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/>
        </svg>
      </button>

      <div class="email-fields" id="ef-signup">
        <input class="field-input" type="email" id="signup-email" placeholder="Email address" autocomplete="email">
        <input class="field-input" type="password" id="signup-password" placeholder="Password (min 8 characters)" autocomplete="new-password">
        <div class="field-error hidden" id="signup-error"></div>
        <button class="btn-submit" onclick="handleEmailSignup()">Create account</button>
        <div class="form-footer"><a class="terms-link" href="https://song-review-app-v2.vercel.app/terms">Terms &amp; Privacy</a></div>
      </div>
    </div>

  </div>

<script>
  // ── EQ VISUALISER — frequency-aware ──
  const eq = document.getElementById('eq');
  const BAR_COUNT = 120;
  const bars = [];

  for (let i = 0; i < BAR_COUNT; i++) {
    const b = document.createElement('div');
    b.className = 'eq-bar';
    b.style.height = '3px';
    eq.appendChild(b);
    bars.push(b);
  }

  const state = bars.map(() => ({ h: 3, target: 3, vel: 0 }));

  let lastMouseX = -1, lastMouseY = -1;
  let mouseActivity = 0;

  // Simulated 120BPM beat clock — kicks every 500ms, with sub-beat at 250ms
  let beatPhase = 0;       // 0–1 within a bar (4 beats)
  let kickEnergy = 0;      // current kick transient energy
  let subEnergy  = 0;      // sub-bass swell
  const BPM = 120;
  const BEAT_MS = (60 / BPM) * 1000;  // 500ms per beat
  let lastTime = performance.now();

  document.addEventListener('mousemove', (e) => {
    const dx = e.clientX - lastMouseX;
    const dy = e.clientY - lastMouseY;
    mouseActivity = Math.min(1, mouseActivity + Math.sqrt(dx*dx + dy*dy) * 0.012);
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
  });

  function tick(now) {
    const dt = now - lastTime;
    lastTime = now;

    // Advance beat clock
    beatPhase = (beatPhase + dt / (BEAT_MS * 4)) % 1; // phase 0–1 over 4 beats (1 bar)

    // Kick drum hits on beats 1 and 3 (phase 0, 0.5)
    // Snare on 2 and 4 (phase 0.25, 0.75)
    const beatPos = (beatPhase * 4) % 1; // 0–1 within each beat
    const isKick   = beatPos < 0.04;
    const isSnare  = Math.abs(beatPos - 0.5) < 0.03;
    const beatNum  = Math.floor(beatPhase * 4); // 0,1,2,3

    if (isKick && (beatNum === 0 || beatNum === 2)) {
      kickEnergy = Math.min(1, kickEnergy + mouseActivity * 0.95 + 0.35);
    }
    if (isSnare && (beatNum === 1 || beatNum === 3)) {
      subEnergy  = Math.min(1, subEnergy  + mouseActivity * 0.6  + 0.22);
    }

    // Decay — slow enough to stay lively while mouse is moving at all
    mouseActivity = Math.max(0.18, mouseActivity - 0.006);
    kickEnergy    = Math.max(0, kickEnergy    - 0.022);
    subEnergy     = Math.max(0, subEnergy     - 0.014);

    const activity = mouseActivity;

    bars.forEach((bar, i) => {
      const s = state[i];
      const t = i / BAR_COUNT; // 0 = leftmost (bass), 1 = rightmost (treble)

      // Frequency band character
      const isBass   = t < 0.20;   // sub + kick — big pumping columns
      const isLow    = t < 0.38;   // low-mid — still meaty
      const isMid    = t < 0.65;   // mids — moderate
      // highs = rest — shimmer, fast, shorter

      // Max height per band
      const maxH = isBass ? 52 : isLow ? 42 : isMid ? 32 : 22;

      // Base energy per band
      let energy = activity;
      if (isBass) energy = Math.max(energy, kickEnergy * 0.95);
      if (isLow)  energy = Math.max(energy, kickEnergy * 0.65 + subEnergy * 0.3);
      if (isMid)  energy = Math.max(energy, subEnergy  * 0.45 + activity * 0.5);

      // Each bar has its own random trigger probability
      const triggerProb = isBass
        ? 0.06 + energy * 0.55          // bass fires hard on beat
        : isLow
        ? 0.05 + energy * 0.38
        : isMid
        ? 0.08 + energy * 0.28
        : 0.10 + energy * 0.20;         // highs shimmer more constantly

      if (Math.random() < triggerProb) {
        const baseH = isBass ? 4 + energy * maxH * 0.92
                    : isLow  ? 4 + energy * maxH * 0.78
                    : isMid  ? 3 + energy * maxH * 0.65
                    :           2 + energy * maxH * 0.55;
        const jitter = Math.random() * (isBass ? 10 : isMid ? 7 : 5) * energy;
        s.target = Math.min(maxH, baseH + jitter);
      } else {
        // Decay — bass holds longer, highs snap back fast
        const decay = isBass ? 0.88 + energy * 0.06
                    : isLow  ? 0.82 + energy * 0.05
                    : isMid  ? 0.74
                    :           0.62;
        s.target = Math.max(2, s.target * decay);
      }

      // Spring physics — bass is heavier (slower), highs are snappy
      const springK  = isBass ? 0.28 : isLow ? 0.32 : isMid ? 0.38 : 0.48;
      const friction  = isBass ? 0.65 : isLow ? 0.60 : isMid ? 0.55 : 0.48;
      const diff = s.target - s.h;
      s.vel = s.vel * friction + diff * springK;
      s.h   = Math.max(2, Math.min(maxH, s.h + s.vel));

      bar.style.height = s.h + 'px';

      // Bass bars slightly brighter when pumping
      const alpha = isBass
        ? 0.15 + (s.h / maxH) * 0.55
        : 0.10 + (s.h / maxH) * 0.38;
      bar.style.background = `rgba(244,240,232,${alpha.toFixed(2)})`;
    });

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);

  // ── TABS & EMAIL ──
  function switchTab(name, el) {
    document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('view-login').classList.toggle('hidden', name !== 'login');
    document.getElementById('view-signup').classList.toggle('hidden', name !== 'signup');
    ['login','signup'].forEach(v => {
      document.getElementById('ef-' + v).classList.remove('open');
      document.getElementById('chev-' + v).classList.remove('open');
    });
  }

  function toggleEmail(view) {
    const fields = document.getElementById('ef-' + view);
    const chev   = document.getElementById('chev-' + view);
    const isOpen = fields.classList.contains('open');
    fields.classList.toggle('open', !isOpen);
    chev.classList.toggle('open', !isOpen);
  }

  // ── BACKGROUND CROSSFADE ──
  const slides = document.querySelectorAll('.bg-slide');
  let current = 0;
  slides[current].classList.add('active');

  setInterval(() => {
    slides[current].classList.remove('active');
    current = (current + 1) % slides.length;
    slides[current].classList.add('active');
  }, 5000);

  // ── AUTH — Supabase JS SDK ──
  const SUPABASE_URL  = 'https://hxtsuhmqrufcdplidtov.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh4dHN1aG1xcnVmY2RwbGlkdG92Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ3ODk3MDksImV4cCI6MjA5MDM2NTcwOX0.STi6L1rrKQcTTRgRrCNnG38m7GnTHRPsoPz2f-ZRyYY';

  // Load Supabase SDK
  const sbScript = document.createElement('script');
  sbScript.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
  sbScript.onload = function() {
    window._sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  };
  document.head.appendChild(sbScript);

  function showError(id, msg) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = msg;
    el.classList.remove('hidden');
  }
  function clearError(id) {
    const el = document.getElementById(id);
    if (el) el.classList.add('hidden');
  }
  function setLoading(btnEl, loading) {
    btnEl.disabled = loading;
    btnEl.style.opacity = loading ? '0.6' : '1';
  }

  async function handleEmailLogin() {
    const btn = event.target;
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    clearError('login-error');
    if (!email || !password) { showError('login-error', 'Please enter your email and password.'); return; }
    if (!window._sb) { window.location.href = 'https://song-review-app-v2.vercel.app'; return; }
    setLoading(btn, true);
    const { error } = await window._sb.auth.signInWithPassword({ email, password });
    if (error) {
      showError('login-error', error.message);
      setLoading(btn, false);
    } else {
      window.location.href = 'https://song-review-app-v2.vercel.app/dashboard';
    }
  }

  async function handleEmailSignup() {
    const btn = event.target;
    const email = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    clearError('signup-error');
    if (!email || !password) { showError('signup-error', 'Please enter your email and password.'); return; }
    if (password.length < 8) { showError('signup-error', 'Password must be at least 8 characters.'); return; }
    if (!window._sb) { window.location.href = 'https://song-review-app-v2.vercel.app'; return; }
    setLoading(btn, true);
    const { error } = await window._sb.auth.signUp({
      email,
      password,
      options: { emailRedirectTo: 'https://song-review-app-v2.vercel.app/dashboard' }
    });
    if (error) {
      showError('signup-error', error.message);
      setLoading(btn, false);
    } else {
      showError('signup-error', 'Check your email to confirm your account.');
      document.getElementById('signup-error').style.color = '#90c890';
      setLoading(btn, false);
    }
  }

  // Handle enter key on inputs
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const active = document.activeElement;
    if (active && active.id === 'login-email') document.getElementById('login-password').focus();
    else if (active && active.id === 'login-password') handleEmailLogin();
    else if (active && active.id === 'signup-email') document.getElementById('signup-password').focus();
    else if (active && active.id === 'signup-password') handleEmailSignup();
  });

</script>
